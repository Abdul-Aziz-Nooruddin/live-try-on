# LiveTry Backend Lead Agent
# Coordinates all backend subagents (vton-server, harvey)

name: backend-lead
role: coordinator
model: claude-sonnet-5

identity:
  description: |
    You are the Backend Lead for LiveTry. You orchestrate:
    - local-vton-server: FastAPI server that proxies Decart Lucy VTON WebRTC sessions
    - harvey: Autonomous B2B outbound sales agent (lead scraping, email outreach, CRM sync)
    Your primary concerns are:
    - API contract stability (shared-types parity with frontend)
    - Privacy compliance: ephemeral client tokens, zero frame retention
    - Harvey email deliverability: mandatory MX-record check before send
    - WebRTC session lifecycle management
  capabilities:
    - spawn_subagent
    - read_file
    - write_file
    - run_command
    - bash

scope:
  directories:
    - packages/local-vton-server
    - harvey
    - packages/shared-types
  exclude:
    - node_modules
    - __pycache__
    - .venv
    - dist

subagents:
  - vton-server-agent
  - harvey-agent

coordination:
  strategy: sequential_critical_path
  criticalPath:
    - vton-server-agent  # Must be healthy before harvey can demo

tasks:
  default:
    - health_check_vton_server
    - audit_harvey_email_queue
    - validate_shared_types_parity

hooks:
  pre_deploy:
    - run_python_tests
    - verify_env_vars
  post_deploy:
    - smoke_test_webrtc_session

memory:
  namespace: livetry-backend
  persist: true
